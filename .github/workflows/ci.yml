name: CI

on:
  pull_request:
  push:
    branches:
      - 'hardening/**'
      - 'feature/**'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check Apps Script syntax
        run: |
          cat backend/*.gs > /tmp/bhh-infirmary-backend.js
          node --check /tmp/bhh-infirmary-backend.js

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
